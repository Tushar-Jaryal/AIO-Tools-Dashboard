services:
  app:
    build: .
    ports:
      - "${PORT:-9000}:9000"
    environment:
      MONGO_URL: mongodb://mongo:27017/aiotools
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
